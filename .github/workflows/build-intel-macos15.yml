name: Build Intel macOS 15 SVN Release

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (e.g. v1.16.0-intel-macos15)'
        required: false
        default: 'v1.16.0-intel-macos15'
      draft:
        description: 'Create as Draft Release'
        type: boolean
        default: false
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build SVN (Intel x86_64 macOS 15)
    runs-on: macos-15-intel

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Verify Architecture & OS
        run: |
          echo '=== System Information ==='
          sw_vers
          uname -a
          arch
          if [ "$(uname -m)" != "x86_64" ]; then
            echo "Error: Expected x86_64 architecture, got $(uname -m)"
            exit 1
          fi

      - name: Install MacPorts
        run: |
          echo '=== Installing MacPorts for macOS 15 Sequoia (x86_64) ==='
          curl -fsSLO https://github.com/macports/macports-base/releases/download/v2.12.7/MacPorts-2.12.7-15-Sequoia.pkg
          sudo installer -pkg MacPorts-2.12.7-15-Sequoia.pkg -target /
          echo "/opt/local/bin:/opt/local/sbin" >> "$GITHUB_PATH"

      - name: Install Dependencies via MacPorts
        run: |
          export PATH="/opt/local/bin:/opt/local/sbin:$PATH"
          echo '=== Installing pre-compiled packages via MacPorts ==='
          sudo port -N install apr apr-util serf1 expat sqlite3 gettext pkgconfig ninja

      - name: Generate CMake Build System
        run: |
          python3 ./gen-make.py -t cmake

      - name: Configure CMake
        run: |
          export PATH="/opt/local/bin:/opt/local/sbin:$PATH"
          export PKG_CONFIG_PATH="/opt/local/lib/pkgconfig:$PKG_CONFIG_PATH"
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="${{ github.workspace }}/dist" \
            -DCMAKE_PREFIX_PATH="/opt/local" \
            -DPKG_CONFIG_EXECUTABLE="/opt/local/bin/pkg-config" \
            -DSVN_USE_PKG_CONFIG=ON \
            -DBUILD_SHARED_LIBS=ON \
            -DSVN_ENABLE_PROGRAMS=ON \
            -DSVN_ENABLE_TOOLS=ON \
            -DSVN_ENABLE_TESTS=OFF \
            -DSVN_ENABLE_RA_SERF=ON \
            -DSVN_ENABLE_NLS=ON \
            -DSVN_ENABLE_APACHE_MODULES=OFF \
            -DSVN_ENABLE_SWIG_PERL=OFF \
            -DSVN_ENABLE_SWIG_PYTHON=OFF \
            -DSVN_ENABLE_SWIG_RUBY=OFF \
            -DSVN_ENABLE_JAVAHL=OFF \
            -DCMAKE_OSX_ARCHITECTURES="x86_64" \
            -DCMAKE_OSX_DEPLOYMENT_TARGET="15.0" \
            -DCMAKE_INSTALL_RPATH="@executable_path/../lib" \
            -DCMAKE_BUILD_WITH_INSTALL_RPATH=FALSE \
            -DCMAKE_INSTALL_NAME_DIR="@rpath"

      - name: Build and Install
        run: |
          export PATH="/opt/local/bin:/opt/local/sbin:$PATH"
          cmake --build build --config Release -j$(sysctl -n hw.ncpu)
          cmake --install build --config Release

      - name: Bundle Dynamic Libraries (Make Standalone)
        run: |
          python3 ./tools/dist/bundle_macos.py "${{ github.workspace }}/dist"

      - name: Verify Binaries
        run: |
          echo '=== Verifying SVN Binary Architecture ==='
          file "${{ github.workspace }}/dist/bin/svn"
          echo '=== Checking Dependencies ==='
          otool -L "${{ github.workspace }}/dist/bin/svn"
          echo '=== Running svn --version ==='
          "${{ github.workspace }}/dist/bin/svn" --version
          echo '=== Running svnadmin --version ==='
          "${{ github.workspace }}/dist/bin/svnadmin" --version

      - name: Add Helper Scripts
        run: |
          cat << 'EOF' > "${{ github.workspace }}/dist/install.sh"
          #!/usr/bin/env bash
          set -e
          DIR="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"
          TARGET="${1:-/usr/local}"
          echo "Installing Subversion to $TARGET..."
          mkdir -p "$TARGET/bin" "$TARGET/lib"
          cp -R "$DIR/bin/"* "$TARGET/bin/"
          cp -R "$DIR/lib/"* "$TARGET/lib/"
          if [ -d "$DIR/share" ]; then
            mkdir -p "$TARGET/share"
            cp -R "$DIR/share/"* "$TARGET/share/"
          fi
          echo "Installed successfully!"
          "$TARGET/bin/svn" --version | head -n 3
          EOF
          chmod +x "${{ github.workspace }}/dist/install.sh"

          cat << 'EOF' > "${{ github.workspace }}/dist/README.md"
          # Subversion for Intel macOS 15 (x86_64)

          Standalone, relocatable Apache Subversion command-line tools compiled for macOS 15 (Intel x86_64).

          ## Quick Start (No installation needed)
          ```bash
          export PATH="/path/to/extracted/bin:$PATH"
          svn --version
          ```

          ## System Install (Optional)
          ```bash
          sudo ./install.sh /usr/local
          ```
          EOF

      - name: Create Release Package
        id: package
        run: |
          TAG="${{ github.event.inputs.tag_name || github.ref_name }}"
          if [ -z "$TAG" ] || [ "$TAG" = "trunk" ]; then
            TAG="v1.16.0-intel-macos15"
          fi
          PKG_NAME="svn-${TAG}-macos15-x86_64"
          mv dist "$PKG_NAME"
          tar -czf "${PKG_NAME}.tar.gz" "$PKG_NAME"
          zip -rq "${PKG_NAME}.zip" "$PKG_NAME"
          shasum -a 256 "${PKG_NAME}.tar.gz" "${PKG_NAME}.zip" > checksums.txt
          echo "archive_tgz=${PKG_NAME}.tar.gz" >> "$GITHUB_OUTPUT"
          echo "archive_zip=${PKG_NAME}.zip" >> "$GITHUB_OUTPUT"
          echo "tag_name=$TAG" >> "$GITHUB_OUTPUT"
          echo "pkg_name=$PKG_NAME" >> "$GITHUB_OUTPUT"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.archive_tgz }}
          path: |
            ${{ steps.package.outputs.archive_tgz }}
            ${{ steps.package.outputs.archive_zip }}
            checksums.txt

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.package.outputs.tag_name }}"
          PKG="${{ steps.package.outputs.pkg_name }}"
          TGZ="${{ steps.package.outputs.archive_tgz }}"
          ZIP="${{ steps.package.outputs.archive_zip }}"
          DRAFT_FLAG=""
          if [ "${{ github.event.inputs.draft }}" = "true" ]; then
            DRAFT_FLAG="--draft"
          fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG exists, uploading assets..."
            gh release upload "$TAG" "$TGZ" "$ZIP" checksums.txt --clobber
          else
            echo "Creating new release $TAG..."
            gh release create "$TAG" "$TGZ" "$ZIP" checksums.txt \
              --title "Subversion CLI for Intel macOS 15 ($TAG)" \
              --notes "### Subversion for Intel macOS 15 (x86_64)

这是使用 GitHub Actions 在 Intel macOS 15 运行器（\`macos-15-intel\`）上编译生成的 Subversion (SVN) 命令行工具。

#### 📦 包含组件
- \`svn\`: 核心版本控制命令行客户端
- \`svnadmin\`: 仓库创建与管理工具
- \`svnlook\`: 仓库检查工具
- \`svnversion\`: 工作副本版本号检测工具
- \`svnsync\`: 仓库镜像同步工具
- \`svnrdump\`: 远程仓库 dump/load 工具
- \`svnserve\`: 自带的独立 SVN 服务守护进程
- \`svnmucc\`: 多 URL 提交客户端
- 完整独立封装动态库：包含 APR、APR-Util、Serf (HTTP/HTTPS 支持)、SQLite3、Expat、Gettext、OpenSSL 3 等，无需额外在目标机器安装 Homebrew 或 MacPorts 即可直接运行。

#### 🚀 安装与使用方法
解压后直接使用（免安装）：
\`\`\`bash
tar -xzf ${TGZ}
cd ${PKG}
./bin/svn --version
\`\`\`

加入环境变量：
\`\`\`bash
export PATH=\"\$(pwd)/bin:\$PATH\"
\`\`\`

或者全局安装（可选）：
\`\`\`bash
sudo ./install.sh /usr/local
\`\`\`

#### 校验码 (SHA256)
查看 \`checksums.txt\` 获取文件完整哈希值。
" \
              $DRAFT_FLAG
          fi
